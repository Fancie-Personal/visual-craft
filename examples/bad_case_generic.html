<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 赋能未来创新大会</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 16px;
    }
    p.subtitle {
      font-size: 18px;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    .cards {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      padding: 0 20px;
    }
    .card {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 20px #8b5cf6;
      text-align: left;
    }
    .card h3 {
      margin-top: 0;
    }
    button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px #a78bfa;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Unlock the power of Next-generation AI: 赋能未来</h1>
    <p class="subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <button>立即体验</button>
  </div>
  <div class="cards">
    <div class="card">
      <h3>🚀 智能加速</h3>
      <p>Lorem ipsum dolor sit amet.</p>
    </div>
    <div class="card">
      <h3>🔒 安全可信</h3>
      <p>Lorem ipsum dolor sit amet.</p>
    </div>
    <div class="card">
      <h3>⚡ 极速响应</h3>
      <p>Lorem ipsum dolor sit amet.</p>
    </div>
  </div>
</body>
</html>
