<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2026 校园创客开源日 · 海报</title>
  <style>
    /* visual-craft specification:
       - Scenario: 校园创客开源日活动海报（暗场、大屏/海报展示）
       - Material: frost (磨砂玻璃)
       - Colors: 主色 #38bdf8 (天蓝), 墨色 #0f172a (深蓝黑), 表面色 rgba(15, 23, 42, 0.65)
       - Font ladder: 14px (正文说明) / 18px (核心参数) / 28px (副标题) / 44px (主标题)
       - Fonts: "PingFang SC", "Microsoft YaHei", sans-serif (规范中文字体回退)
    */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.2) 0%, transparent 45%),
        linear-gradient(180deg, #0b0f19 0%, #030712 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .poster-container {
      width: 100%;
      max-width: 680px;
      /* frost recipe */
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 48px 40px;
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.25;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p.lead {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(248, 250, 252, 0.82);
      margin-bottom: 32px;
    }
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 0;
    }
    .detail-item .label {
      font-size: 13px;
      color: rgba(248, 250, 252, 0.5);
      margin-bottom: 4px;
    }
    .detail-item .value {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
    }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .meta-note {
      font-size: 13px;
      color: rgba(248, 250, 252, 0.45);
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <div class="tag">Nexus Core · 创客工坊</div>
    <h1>2026 校园开源创客日</h1>
    <p class="lead">从一行代码到硬件智造，面向全校中职学生的 AI 实践与开源项目协作体验。</p>
    
    <div class="details-grid">
      <div class="detail-item">
        <div class="label">活动时间</div>
        <div class="value">2026 年 9 月 15 日 13:30 - 17:00</div>
      </div>
      <div class="detail-item">
        <div class="label">活动地点</div>
        <div class="value">实训大楼 402 创客中心</div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-primary">报名参加工作坊</button>
      <span class="meta-note">材料规范：frost 磨砂玻璃 · Nexus Core</span>
    </div>
  </main>
</body>
</html>
